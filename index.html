<title>Đấu trường Động học</title>

<style>
/* Giao diện sáng, nhiều màu cho máy chiếu: thanh trên (vòng + điểm) · sân khấu · thanh điều khiển. Mỗi vòng một màu chủ đạo (--rc, --rc2). */
:root{
  --bg:#F5F3FF; --stage:#FFFFFF; --ink:#1A1F3A; --ink2:#454B6B; --muted:#6E7391; --line:#DCDDEB; --soft:#EEEDF8;
  --brand:#1B2A6B; --gold:#FACC15; --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#E11D48; --bad-bg:#FFE4E6;
  --t0:#7C3AED; --t1:#0D9488; --t2:#EA580C; --t3:#2563EB;
  --oA:#F43F5E; --oB:#3B82F6; --oC:#F59E0B; --oD:#22C55E;
  --cL:#F26B3A; --cL2:#FFB13B; --cR:#2F7DE1; --cR2:#06B6D4;
  --display:'Lexend','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:clamp(15px,1.05vw,20px)/1.5 var(--body);
  background:radial-gradient(1100px 600px at 0% 0%,#FFE4D3 0,transparent 60%),radial-gradient(900px 600px at 100% 0%,#DCE9FF 0,transparent 55%),radial-gradient(1000px 700px at 50% 110%,#E3F9EC 0,transparent 60%),var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
mjx-container{color:inherit}
.app{max-width:1640px;margin:0 auto;padding-block:12px 18px;display:flex;flex-direction:column;gap:12px;min-height:100%}

/* thanh trên */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:linear-gradient(110deg,#1B2A6B,#4B2A8C 55%,#9D2C7A);color:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px #4B2A8C33}
.logo{font-family:var(--display);font-weight:900;font-size:1.25em;white-space:nowrap}
.logo small{display:block;font:600 .6em/1.2 var(--body);opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:rgba(255,255,255,.08);color:#E4E6F7;border-radius:12px;padding:6px 11px;font-weight:700;font-size:.86em;display:flex;gap:6px;align-items:center}
.tabs button i{font-style:normal;width:1.55em;height:1.55em;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;font-size:.85em}
.tabs button[aria-current="page"]{background:#fff;color:var(--brand);box-shadow:0 0 0 3px var(--rc)}
.tabs button:not([aria-current]):hover{background:rgba(255,255,255,.2)}
#board{margin-left:auto}
.board4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:min(100%,660px)}
.team{background:#fff;color:var(--ink);border-radius:14px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;border-left:8px solid var(--tc);position:relative}
.team .nm{font-weight:800;font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tc)}
.team .sc{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:2em;line-height:1;color:var(--tc);font-variant-numeric:tabular-nums}
.team .sub{font-size:.7em;color:var(--muted);font-weight:600}
.team .adj{display:flex;gap:4px}
.team .adj button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:0 7px;font-size:.72em;line-height:1.5}
.team.turn{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold);animation:turn 1.4s ease-in-out infinite}
@keyframes turn{50%{box-shadow:0 0 0 4px var(--gold),0 0 30px var(--gold)}}
.team.bump .sc,.clsb.bump .cl-s{animation:bump .7s ease}
@keyframes bump{30%{transform:scale(1.45)}}
.team .star{position:absolute;right:6px;top:-9px;font-size:.78em;background:var(--gold);color:var(--brand);border-radius:8px;padding:0 6px;font-weight:800}
.clsb{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:16px;padding:6px 16px;font-weight:800}
.cl-l{font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cl-s{font:900 2.1em/1 var(--display);background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;min-width:2ch;display:inline-block}
.okc{color:var(--ok)}.bdc{color:var(--bad)}
.clsb .okc,.clsb .bdc,.clsb .run{font-size:1.15em;border-radius:12px;padding:2px 10px}
.clsb .okc{background:var(--ok-bg)}.clsb .bdc{background:var(--bad-bg)}
.clsb .run{background:#FFEDD5;color:#C2410C;animation:bump 1s ease}

/* sân khấu */
.stage{flex:1;background:var(--stage);border-radius:22px;padding:clamp(14px,2vw,30px);border:1px solid var(--line);border-top:8px solid var(--rc);display:flex;flex-direction:column;gap:14px;min-height:0;box-shadow:0 10px 30px #1B2A6B14}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.rnum{font-family:var(--display);font-weight:900;color:#fff;background:linear-gradient(120deg,var(--rc),var(--rc2));border-radius:12px;padding:3px 14px;font-size:.95em;box-shadow:0 4px 12px color-mix(in srgb,var(--rc) 40%,transparent)}
.rhead h1{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.1vw,40px);margin:0;letter-spacing:-.01em;color:var(--rc)}
.rhead .rule{color:var(--muted);font-size:.9em;flex-basis:100%}
.qcount{margin-left:auto;font-weight:800;color:var(--rc);font-variant-numeric:tabular-nums}
.prog{width:clamp(120px,14vw,240px);height:12px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rc),var(--rc2));border-radius:8px;transition:width .6s}
.qbox{font-size:clamp(20px,1.65vw,34px);line-height:1.5;font-weight:600;max-width:64ch;margin:0}
.qbox.sm{font-size:clamp(18px,1.4vw,28px);margin:0 0 8px}
.qbox.eq{margin:0 0 8px}
.qq{margin:0 0 8px;font-weight:800;font-size:1.05em;color:var(--rc)}
.ctx{color:var(--ink2);font-size:.95em;margin:0}

/* phương án */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid color-mix(in srgb,var(--oc) 40%,#fff);border-radius:16px;padding:12px 16px;font-size:clamp(17px,1.35vw,28px);
  background:color-mix(in srgb,var(--oc) 8%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--oc) 30%,#fff);min-width:0;transition:transform .15s,box-shadow .15s;position:relative}
button.opt:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 7px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--oc) 40%,#fff)}
button.opt:disabled{cursor:default}
.opt .lt{flex:none;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;background:var(--oc);box-shadow:0 3px 0 color-mix(in srgb,var(--oc) 60%,#000)}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 0 5px #16A34A33;animation:glow 1.3s ease 2}
.opt.right .lt{background:var(--ok)}
.opt.right::after{content:'✔';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--ok);font-weight:900}
@keyframes glow{50%{box-shadow:0 0 0 12px #16A34A22}}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.72;box-shadow:none}
.opt.wrong .lt{background:var(--bad)}
.opt.wrong::after{content:'✘';position:absolute;right:12px;top:6px;font-size:1.3em;color:var(--bad);font-weight:900}
.opt.dim{opacity:.38;box-shadow:none}
.opt .who{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt .ot{min-width:0}
.chip{border-radius:20px;padding:0 9px;font-size:.6em;font-weight:800;color:#fff;background:var(--tc);white-space:nowrap}
.why{border-left:6px solid var(--ok);background:var(--ok-bg);border-radius:0 14px 14px 0;padding:10px 16px;font-size:clamp(16px,1.2vw,24px);animation:slidein .5s ease}
.why b.h{color:var(--ok)}
.why.ask{border-left-color:var(--gold);background:#FEF9C3}.why.ask b.h{color:#A16207}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}}

/* thẻ chọn của các đội */
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{border:3px solid var(--tc);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--tc) 6%,#fff)}
.pk .tn{font-weight:800;color:var(--tc);font-size:.85em;margin-right:auto}
.pk button{width:2.1em;height:2.1em;border-radius:50%;border:2px solid color-mix(in srgb,var(--oc) 50%,#fff);background:#fff;font-family:var(--display);font-weight:900;font-size:.85em;color:var(--oc)}
.pk button[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff;transform:scale(1.1)}
.pk.ok{background:var(--ok-bg)}.pk.no{background:var(--bad-bg)}

/* điều khiển */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 18px #1B2A6B10}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 14px;font-weight:800}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:linear-gradient(120deg,#1B2A6B,#4B2A8C);border-color:transparent;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--brand)}
.btn.call{background:linear-gradient(120deg,#F26B3A,#E0457B);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.timer{font-family:var(--display);font-weight:900;font-size:1.6em;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;color:var(--brand)}
.timer.low{color:var(--bad);animation:bump .5s infinite}
.sp{flex:1}
.hint{color:var(--muted);font-size:.85em;margin:0}

/* bảng số liệu */
.dtw{overflow-x:auto}
.dt{border-collapse:separate;border-spacing:0;font-size:clamp(17px,1.35vw,28px);font-variant-numeric:tabular-nums;border-radius:14px;overflow:hidden;border:2px solid color-mix(in srgb,var(--rc) 35%,#fff)}
.dt th,.dt td{padding:6px 18px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
.dt th{background:color-mix(in srgb,var(--rc) 14%,#fff);font-weight:700;color:var(--ink)}
.dt tr:nth-child(even) td{background:color-mix(in srgb,var(--rc) 4%,#fff)}
.v3{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:start}
.v3 .opts{grid-template-columns:minmax(0,1fr)}
.v3.nt{grid-template-columns:minmax(0,1fr)}.v3.nt .opts{grid-template-columns:repeat(2,minmax(0,1fr))}

/* vòng 2: lật thẻ, hai phía hai màu */
.mem2{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.side{border-radius:20px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.side.sL{background:linear-gradient(180deg,#FFE9DC,#FFF6EF)}.side.sR{background:linear-gradient(180deg,#DFEBFF,#F1F7FF)}
.side h3{margin:0;font:800 1em var(--display)}.side.sL h3{color:var(--cL)}.side.sR h3{color:var(--cR)}
.side .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.card{position:relative;border:0;border-radius:16px;min-height:clamp(84px,9.5vh,150px);padding:0;background:transparent;perspective:900px}
.card .in{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;padding:8px 10px;text-align:center}
.card .b{color:#fff;font-family:var(--display);font-weight:900;font-size:clamp(26px,2.6vw,48px);text-shadow:0 3px 0 #0003;box-shadow:0 5px 0 #0002}
.card.sL .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cL2),var(--cL) 60%,#E0457B)}
.card.sR .b{background:radial-gradient(circle at 20% 20%,#ffffff33 0 10%,transparent 11%) 0 0/28px 28px,linear-gradient(135deg,var(--cR2),var(--cR) 60%,#5B5BF0)}
.card:not(.up):hover .b{filter:brightness(1.08);transform:translateY(-2px)}
.card .f{transform:rotateY(180deg);border:3px solid var(--kc);font-size:clamp(14px,1.18vw,24px);padding-top:18px;line-height:1.35;overflow:hidden}
.card.sL{--kc:var(--cL)}.card.sR{--kc:var(--cR)}
.card.sL .f{background:#FFF5EE}.card.sR .f{background:#F0F6FF}
.card .f .tag{position:absolute;left:8px;top:4px;font:900 .75em var(--display);color:#fff;background:var(--kc);border-radius:8px;padding:0 7px}
.card.done .f{border-color:var(--ok);box-shadow:inset 0 0 0 3px #16A34A44}
.card.done .f::before{content:'✔';position:absolute;right:8px;top:2px;color:var(--ok);font-weight:900}
.card.done .f::after{content:attr(data-team);position:absolute;right:8px;bottom:4px;font-size:.62em;font-weight:800;color:#fff;background:var(--tc);border-radius:10px;padding:0 8px}
.card.done:not([data-team]) .f::after{display:none}
.card.miss .f{background:var(--bad-bg);border-color:var(--bad)}
.card.pulse .in{animation:pulse .8s ease}
@keyframes pulse{40%{transform:rotateY(180deg) scale(1.08)}}
.card .f mjx-container>svg{max-width:100%;height:auto}
.card .f.sm{font-size:clamp(12px,.88vw,18px)}

/* vòng 3: phân nhóm */
.pnq{color:var(--rc)}
.pnw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;flex:1;align-items:stretch}
.bin{border-radius:22px;padding:12px;min-height:42vh;display:flex;flex-direction:column;gap:8px;border:3px dashed;text-align:left;transition:transform .2s}
.bin.b0{background:linear-gradient(180deg,#FFE4D6,#FFF6F0);border-color:var(--cL)}
.bin.b1{background:linear-gradient(180deg,#DCE9FF,#F2F7FF);border-color:var(--cR)}
.bin:not([aria-disabled]):hover{transform:scale(1.015)}
.bin .bh{display:block;text-align:center;color:#fff;border-radius:14px;padding:8px 10px;font:800 clamp(17px,1.35vw,26px)/1.3 var(--display)}
.bin.b0 .bh{background:linear-gradient(120deg,var(--cL2),var(--cL))}.bin.b1 .bh{background:linear-gradient(120deg,var(--cR2),var(--cR))}
.bin .drop{display:block;text-align:center;font-weight:800;min-height:1.4em;animation:bump 1s infinite}
.bin.b0 .drop{color:var(--cL)}.bin.b1 .drop{color:var(--cR)}
.placed{display:flex;gap:6px;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:6px 10px;font-size:clamp(14px,1vw,20px);animation:slidein .5s ease}
.bin.b0 .placed{border-left:6px solid var(--cL)}.bin.b1 .placed{border-left:6px solid var(--cR)}
.pile{display:flex;flex-direction:column;gap:8px;justify-content:center}
.itm{border:2px solid #CBD0E6;background:#fff;border-radius:14px;padding:10px 14px;font-size:clamp(15px,1.15vw,23px);text-align:left;box-shadow:0 4px 0 #CBD0E6;transition:transform .15s}
.itm:hover{transform:translateY(-2px)}
.itm.sel{border-color:#8B5CF6;background:#F3EEFF;box-shadow:0 0 0 5px #8B5CF655;transform:scale(1.03)}

/* vòng 5: đồ thị */
.v4{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.plotw{border:2px solid color-mix(in srgb,var(--rc) 25%,#fff);border-radius:16px;padding:10px 12px;background:#FBFCFF}
.plotw>svg{width:100%;height:auto;display:block;max-height:38vh}
.axl{display:flex;justify-content:space-between;gap:10px;font-size:clamp(14px,1.05vw,20px);color:var(--ink2);margin-top:4px}
.v4 .opts{grid-template-columns:minmax(0,1fr)}
.v4 .opt{font-size:clamp(15px,1.12vw,23px);padding:8px 12px}
.v4 .opts.g{grid-template-columns:repeat(2,minmax(0,1fr))}.v4 .opts.g .opt{flex-wrap:wrap;padding:6px 8px;gap:6px;align-items:flex-start}
.v4 .opts.g .ot{flex:1 1 70%;min-width:0}.mini{width:100%;height:auto;display:block;max-height:15vh}

/* vòng 6 */
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-left:8px solid var(--oc,var(--line));border-radius:14px;padding:8px 14px;background:#fff;text-align:left;font-size:clamp(16px,1.25vw,26px);width:100%;transition:transform .15s}
.step:not(:disabled):hover{transform:translateX(4px)}
.step .lt{flex:none;width:1.9em;height:1.9em;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--oc,#888) 18%,#fff);color:var(--ink);font-family:var(--display);font-weight:900}
.step .no{margin-left:auto;flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-family:var(--display);font-weight:900;animation:bump .4s}
.step .no.gr{background:var(--muted)}
.step.on{background:#F3EEFF}
.step.ok{border-color:var(--ok);background:var(--ok-bg)}
.step.ln{border-left-color:var(--rc)}
.step.badl{border-color:var(--bad);background:var(--bad-bg)}
.step.wl{opacity:.5;text-decoration:line-through;text-decoration-color:var(--bad)}
.buzz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.buzz button{border:3px solid var(--tc);background:#fff;border-radius:12px;padding:6px 14px;font-weight:800;color:var(--tc)}
.buzz button[aria-pressed="true"]{background:var(--tc);color:#fff}
.buzz button.tried{opacity:.45}
.banner{border-radius:14px;padding:10px 16px;font-weight:800;font-size:clamp(17px,1.3vw,26px);animation:slidein .5s ease}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad)}

/* trang chủ */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(38px,4vw,72px);line-height:1;margin:0 0 12px;color:var(--brand);letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#F26B3A,#E0457B,#8B5CF6,#2F7DE1);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 12px;max-width:62ch;color:var(--ink2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modes button{border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s}
.modes button:hover{transform:translateY(-2px)}
.modes .me{font-size:1.8em;line-height:1.1}
.modes button b{font:900 1.2em var(--display)}.modes button span:not(.me){font-size:.8em;color:var(--muted)}

<script>
/* ================= NGÂN HÀNG CÂU HỎI – CHƯƠNG 2 (Sách BT KTPU, Bảng 2.1–2.9) ================= */
const R = String.raw;

/* ---------- Vòng 1: Khởi động ---------- */
const R1 = [
 {q:R`Hằng số tốc độ \(k = 0{,}05\ \mathrm{L\cdot mol^{-1}\cdot s^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:2,

 {q:R`Hằng số tốc độ \(k = 2{,}5\times10^{-3}\ \mathrm{mol\cdot L^{-1}\cdot min^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:0,

 {q:R`Hằng số tốc độ \(k = 0{,}12\ \mathrm{min^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:1,
  why:R`Không có thừa số nồng độ: \(1-n = 0\), \(n = 1\).`},
 {q:R`Hằng số tốc độ \(k = 4\ \mathrm{L^{2}\cdot mol^{-2}\cdot s^{-1}}\). Phản ứng có bậc:`,o:['Bậc 0','Bậc 1','Bậc 2','Bậc 3'],a:3,
  why:R`\((\mathrm{mol/L})^{-2}\) nên \(1-n = -2\), \(n = 3\).`},
 {q:R`Đúng hay sai: phản ứng bậc 1 có thời gian bán hủy \(t_{1/2}\) <b>không phụ thuộc</b> \(C_\mathrm{Ao}\).`,o:['Đúng','Sai'],a:0,
  why:R`\(t_{1/2} = \dfrac{\ln 2}{k}\) (Bảng 2.1).`},
 {q:R`Đúng hay sai: phản ứng bậc 0 có \(t_{1/2}\) <b>tỉ lệ nghịch</b> với \(C_\mathrm{Ao}\).`,o:['Đúng','Sai'],a:1,
  why:R`\(t_{1/2} = \dfrac{C_\mathrm{Ao}}{2k}\): tỉ lệ <b>thuận</b>. Tỉ lệ nghịch là bậc 2: \(t_{1/2} = \dfrac{1}{kC_\mathrm{Ao}}\).`},
 {q:R`Phản ứng pha khí A → 2B thực hiện đẳng áp, nhập liệu A nguyên chất. Hệ số thay đổi thể tích \(\varepsilon_\mathrm{A}\) bằng:`,o:['0','0,5','1','2'],a:2,

let AC=null;
function tone(fr,dur,type='sine',vol=.12,delay=0,to=null){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;const t=AC.currentTime+delay;o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(_){}}
const sGood=big=>{[523,659,784,1047].forEach((f,k)=>tone(f,.2,'triangle',.14,k*.075));tone(1568,.4,'sine',.07,.32);tone(2093,.3,'sine',.05,.42);
  if(big)[784,988,1175,1568,1976].forEach((f,k)=>tone(f,.25,'square',.045,.55+k*.09));};

/* ---------- hiệu ứng ---------- */
const PAL=['#F26B3A','#FFB13B','#22C55E','#2F7DE1','#8B5CF6','#E0457B','#06B6D4','#FACC15'];
const FX={parts:[],run:false};
function confetti(x,y,n=120,pow=1){if(RM())return;n=Math.round(n*.5);pow*=.7;const c=$('#fxc');c.width=innerWidth;c.height=innerHeight;
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*10)*pow;
    FX.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7*pow,s:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:pick(PAL),sh:k%3,life:0});}
  if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop);}}
function fxLoop(){const c=$('#fxc'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  FX.parts=FX.parts.filter(p=>p.y<c.height+40&&p.life<260);
  FX.parts.forEach(p=>{p.life++;p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;
    if(p.sh===0)g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){g.beginPath();g.arc(0,0,p.s/2.6,0,7);g.fill();}
    else{g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708;g.lineTo(Math.cos(a)*p.s/1.6,Math.sin(a)*p.s/1.6);g.lineTo(Math.cos(a+.628)*p.s/3.4,Math.sin(a+.628)*p.s/3.4);}g.fill();}
    g.restore();});
  if(FX.parts.length)requestAnimationFrame(fxLoop);else{FX.run=false;g.clearRect(0,0,c.width,c.height);}}
const PRAISE=[['🎉','Chính xác!'],['🌟','Tuyệt vời!'],['🚀','Xuất sắc!'],['🏆','Quá đỉnh!'],['💯','Chuẩn luôn!'],['👏','Hoan hô!']];
const OOPS=[['🤔','Chưa đúng rồi!'],['😅','Suýt nữa thôi!'],['💡','Nghĩ thêm chút nhé!'],['🙈','Ối, chưa phải!']];
let popT=null;
function pop(kind,sub,big){const d=$('#pop'),[e,t]=kind==='ok'?pick(PRAISE):pick(OOPS);
  d.className='pop '+kind+(big?' big':'');d.innerHTML=`<div class="pe">${e}</div><div class="pt">${t}</div>${sub?`<div class="ps">${sub}</div>`:''}`;
  void d.offsetWidth;d.classList.add('go');const m=/\\\(/.test(sub||'');if(m)tset(d);clearTimeout(popT);popT=setTimeout(()=>d.classList.remove('go'),big||m?3200:1700);}
function flash(kind){const f=$('#flash');f.className='flash '+kind;void f.offsetWidth;f.classList.add('go');}
function shake(el){if(!el||RM())return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function floatTxt(el,txt){if(!el)return;const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='fpt';s.textContent=txt;
  s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1400);}
const ctr=el=>{const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};return [r.left+r.width/2,r.top+r.height/2];};
function good(el,sub,{big=false,pts=''}={}){sGood(big);const [x,y]=ctr(el);confetti(x,y,big?240:120,big?1.25:1);if(big)setTimeout(()=>confetti(innerWidth*.2,innerHeight*.35,90),250),setTimeout(()=>confetti(innerWidth*.8,innerHeight*.35,90),450);
  pop('ok',sub,big);flash('ok');if(pts)floatTxt(el,pts);}
function bad(el,sub){sBad();shake(el);pop('bad',sub);flash('bad');}

const RL=()=>Array.isArray(S.roster)?S.roster:[];
function callSV(){const L=RL(),n=L.length||Math.max(1,+S.size||40);let pool=Array.from({length:n},(_,i)=>i+1).filter(x=>!S.called.includes(x));if(!pool.length){S.called=[];pool=Array.from({length:n},(_,i)=>i+1);}
  const res=pick(pool),box=$('#call'),cn=box.querySelector('.cn'),cl=box.querySelector('.cl');box.hidden=false;box.classList.remove('done');box.classList.toggle('nm',!!L.length);
  cl.textContent=L.length?'🎲 Mời bạn':'🎲 Mời sinh viên số';box.querySelector('.cs').textContent='Đang quay…';let k=0;
  const cm=box.querySelector('.cm');const show=x=>{if(!L.length){cn.textContent=x;cm.textContent='';return;}const t=L[x-1],m=t.match(/^(?:\d{1,3}[.)]\s*)?(\d{5,})\s*[–-]?\s*(.+)$/);cn.textContent=m?m[2]:t;cm.textContent=m?'MSSV '+m[1]:'';};
  const spin=setInterval(()=>{show(1+Math.floor(Math.random()*n));sTick();if(++k>=(RM()?1:22)){clearInterval(spin);show(res);box.classList.add('done');
    S.called.push(res);save();box.querySelector('.cs').textContent=`${L.length?`STT ${res} · `:''}Đã gọi ${S.called.length}/${n} bạn · bấm vào đây để đóng`;sGood();confetti(innerWidth/2,innerHeight*.45,90);}},75);}

function tset(el){if(!window.__mjReady||!window.MathJax||!MathJax.typesetPromise)return Promise.resolve();

const TM={left:0,total:0,run:false,h:null};
function tStart(sec){if(sec)TM.left=TM.total=sec;if(TM.left<=0)TM.left=TM.total;TM.run=true;clearInterval(TM.h);
  TM.h=setInterval(()=>{TM.left--;if(TM.left<=0){TM.left=0;TM.run=false;clearInterval(TM.h);sEnd();}else if(TM.left<=5)tone(880,.06,'square',.04);paintTimer();},1000);paintTimer();}
function tPause(){TM.run=false;clearInterval(TM.h);paintTimer();}
function tReset(sec){tPause();TM.left=TM.total=sec;paintTimer();}
function paintTimer(){const el=$('#tm');if(!el)return;const m=Math.floor(TM.left/60),s=TM.left%60;el.textContent=m+':'+String(s).padStart(2,'0');
  el.classList.toggle('low',TM.left<=5&&TM.total>0);const b=$('#tmb');if(b)b.textContent=TM.run?'⏸ Tạm dừng':'⏱ Bắt đầu giờ';}

/* ---------- đồ thị vòng 4 ---------- */
function norm(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return pts.map(([x,y])=>[(x-x0)/((x1-x0)||1),(y-y0)/((y1-y0)||1)]);}
function drawPlot(it,t){const svg=$('#plot');if(!svg)return;
  const A=norm(it.raw.pts),B=norm(it.raw.pts.map(([x,y])=>it.lin.f(x,y)));
  const W=600,H=340,L=46,Rr=20,T=18,Bt=34,pw=W-L-Rr,ph=H-T-Bt;
  const P=A.map((a,k)=>[a[0]*(1-t)+B[k][0]*t,a[1]*(1-t)+B[k][1]*t]).map(([u,v])=>[L+16+u*(pw-32),T+12+(1-v)*(ph-24)]);
  let s=`<line x1="${L}" y1="${H-Bt}" x2="${W-Rr}" y2="${H-Bt}" stroke="#13213A" stroke-width="2.5"/><line x1="${L}" y1="${H-Bt}" x2="${L}" y2="${T}" stroke="#13213A" stroke-width="2.5"/>
   <path d="M${W-Rr},${H-Bt} l-10,-5 v10z M${L},${T} l-5,10 h10z" fill="#13213A"/>`;
  s+=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${t>=1?'#1E8E4F':'#2E86AB'}" stroke-width="${t>=1?4:3}" stroke-linejoin="round" ${t>=1?'stroke-dasharray="0"':''}/>`;
  s+=P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7" fill="#fff" stroke="#14325C" stroke-width="3"/>`).join('');
  svg.innerHTML=s;}
function animPlot(it){const t0=performance.now(),D=1300;
  const xl=$('#xlab'),yl=$('#ylab');if(xl&&yl){xl.innerHTML='Trục hoành: '+it.lin.xl;yl.innerHTML='Trục tung: '+it.lin.yl;tset($('.axl'));}
  const reduce=RM();
  const step=now=>{let t=reduce?1:Math.max(0,Math.min(1,(now-t0)/D));t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;drawPlot(it,t);if(t<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

function judge5(ok,sel){const i=S.r5.i,q=q5(i),t=q.buzz,st=S.st.r5;snap();

  const first=q.tried.length===0,star=q.star===t&&first;
  let d=ok?(first?RD.r5.pts:half('r5'))*(star?2:1):(first?(star?-RD.r5.pts:-10):0);

  else{q.res='bad';q.tried.push(t);q.buzz=null;q.picks=[];save();render();renderBoard([t]);bad($('.steps'),`${esc(S.teams[t].name)} ${d}`);}}

let FL=false;
async function flush(){if(!GS||FL||!(S.gq||[]).length)return paintGS();FL=true;paintGS();
  for(const p of [...S.gq]){try{await fetch(GS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
      S.gq=S.gq.filter(x=>x!==p&&!(x.vn===p.vn&&x.ma===p.ma));const r=RK[p.vn-1];S.sent[r]={ma:p.ma,at:new Date().toLocaleString('vi-VN')};save();}
    catch(_){break;}}
  FL=false;paintGS();}
function gsMsg(r){const p=S.sv&&payload(r),s=(S.sent||{})[r],w=(S.gq||[]).find(x=>x.vn===RD[r].n);
  if(!p||(!p.dung&&!p.sai&&!p.xong))return ['','Vòng này chưa có câu trả lời nào nên chưa gửi kết quả.'];
  if(!GS)return ['wait',`Chụp màn hình gửi giáo viên · mã xác nhận <code>${p.ma}</code> (link chưa gắn Google Sheet).`];
  if(s&&s.ma===p.ma)return ['ok',`✔ Đã gửi kết quả cho giáo viên lúc ${s.at} · mã xác nhận <code>${s.ma}</code>`];
  if(w)return FL?['wait','⏳ Đang gửi kết quả…']:['bad',`Chưa gửi được (mất mạng?). <button class="btn" id="gsre">↻ Gửi lại</button>`];
  return ['wait','⏳ Đang gửi kết quả…'];}
function paintGS(){const b=$('#gs');if(!b)return;const r=b.dataset.r;
  if(r){const [c,m]=gsMsg(r);b.className='gsbox '+c;b.innerHTML=m;return;}
  b.innerHTML='<b>Kết quả đã gửi cho giáo viên</b><br>'+RK.map(x=>{const [c]=gsMsg(x);return `Vòng ${RD[x].n}: ${c==='ok'?'✔ đã gửi':c==='bad'?'✘ chưa gửi được':S.st[x].ok+S.st[x].bad?'⏳ đang gửi':'— chưa làm'}`;}).join(' · ')+
   ((S.gq||[]).length&&!FL?` <button class="btn" id="gsre">↻ Gửi lại</button>`:'');b.className='gsbox';}
if(NHA){
  const _kq=vKQ;vKQ=function(){_kq();$('.kq').insertAdjacentHTML('beforeend',`<div class="gsbox" id="gs" data-r="${S.kq}"></div>`);sendRound(S.kq);paintGS();};
  const _end=vEnd;vEnd=function(){_end();$('#stage .rhead').insertAdjacentHTML('afterend',`<div class="gsbox" id="gs"></div>`);RK.forEach(sendRound);paintGS();};
  const _home=vHome;vHome=function(){_home();const h=$('.hero');h.querySelectorAll('.modes,.setup1,.setup,.cards4').forEach(x=>x.remove());
    h.insertAdjacentHTML('beforeend',`<div class="svcard"><span>👤 <b>${esc(S.sv.ten)}</b> · ${esc(S.sv.mssv)} · Lớp ${esc(S.sv.lop)}${BAI?` · ${esc(BAI)}`:''}</span><span class="sp"></span><button class="btn" id="svchg">Đổi sinh viên</button></div>
     <p class="hint">Làm lần lượt 6 vòng. Làm hết câu của một vòng rồi bấm <b>Kết thúc vòng 🏁</b>: kết quả vòng đó tự gửi cho giáo viên. Được làm lại (<b>↻ Chơi lại vòng này</b>) để cải thiện; giáo viên lấy kết quả tốt nhất. Bấm <b>Xem đáp án</b> thì câu đó không được tính đúng.</p>`);};
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='gsre'){flush();return;}
    if(b.id==='svchg'){if(!confirm('Đổi sinh viên sẽ xóa toàn bộ tiến độ làm bài trên máy này. Tiếp tục?'))return;S=fresh();S.mode='lop';save();render();}},true);
  addEventListener('online',flush);
  /* đổi lời hướng dẫn dành cho giáo viên thành lời cho sinh viên tự làm */
  const TX=[['Gọi sinh viên trả lời, bấm vào phương án bạn ấy chọn.','Bấm vào phương án bạn chọn.'],
    ['Gọi sinh viên ghép một thẻ cam với một thẻ xanh (ví dụ “3 – E”) và giải thích.','Ghép một thẻ cam với một thẻ xanh.'],
    ['Gọi sinh viên: chọn một thẻ ở giữa, rồi bấm vào nhóm bạn ấy nói.','Chọn một thẻ ở giữa, rồi bấm vào nhóm đúng.'],
    ['Gọi sinh viên đọc thứ tự các chữ cái; giáo viên bấm lần lượt theo lời bạn ấy.','Bấm lần lượt các bước theo đúng thứ tự.'],
    ['Gọi sinh viên chỉ ra dòng sai đầu tiên; giáo viên bấm vào dòng đó, sau đó bạn ấy nêu cách sửa.','Bấm vào dòng sai đầu tiên, sau đó tự nêu cách sửa.'],
    ['Mời bạn khác trả lời','Thử lại nhé'],['Mời bạn khác thử','Thử lại nhé'],['Điểm cả lớp','Tổng điểm của bạn'],['điểm của lớp','điểm của bạn'],
    ['Cả lớp nắm rất chắc phần này!','Bạn nắm rất chắc phần này!'],['Phần này cần giảng lại.','Bạn nên xem lại video của phần này.'],
    ['Tổng kết cả lớp','Kết quả của bạn'],['Câu nên giảng lại','Câu nên xem lại'],['chưa ai đúng','chưa đúng']];
  const fixT=root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let v=n.nodeValue,o=v;for(const [a,b] of TX)if(v.includes(a))v=v.split(a).join(b);if(v!==o)n.nodeValue=v;}};
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(x=>x.nodeType===1?fixT(x):x.nodeType===3&&fixT(x.parentNode||document.body)))).observe(document.body,{childList:true,subtree:true});
  fixT(document.body);
}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view)go(v);});
{const h=location.hash.slice(1);if(VIEWS.includes(h))S.view=h;}
tReset(TDEF[CR()]||0);render();if(NHA)flush();

</script>
